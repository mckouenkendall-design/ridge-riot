<style>
/* Ridge Riot: menus and on-screen display.
   The look is borrowed from race number plates and paddock stickers:
   slanted plates, thick ink outlines, hard offset shadows. */
:root {
  color-scheme: dark;
  --ink: #171a22; --plate: #f6f2e7; --yellow: #f2c230; --red: #e2402f; --blue: #2f6fd6; --dim: rgba(23, 26, 34, 0.62);
  --font: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "HelveticaNeue-CondensedBold", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(10px, min(4.5vh, 2.15vw), 30px); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { font-family: var(--font); color: var(--plate); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: none; padding: calc(0.7rem + var(--safe-t)) calc(1rem + var(--safe-r)) calc(0.7rem + var(--safe-b)) calc(1rem + var(--safe-l)); pointer-events: auto; }
.screen.on { display: block; }
.shade { background: linear-gradient(90deg, rgba(23, 26, 34, 0.82), rgba(23, 26, 34, 0.5)); }
.shade.full { background: rgba(23, 26, 34, 0.8); }
#s-garage.shade.full { background: rgba(23, 26, 34, 0.9); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 0.18rem solid var(--yellow); outline-offset: 0.2rem; }

/* plates and buttons */
.plate { background: var(--plate); color: var(--ink); border: 0.16rem solid var(--ink); border-radius: 0.5rem; box-shadow: 0.26rem 0.26rem 0 var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 2.7rem; padding: 0.35rem 1.4rem; font-weight: 900; font-style: italic; font-size: 1.35rem; letter-spacing: 0.02em;
  background: var(--plate); color: var(--ink); border: 0.16rem solid var(--ink); border-radius: 0.5rem; box-shadow: 0.26rem 0.26rem 0 var(--ink); transform: skewX(-8deg); transition: transform 0.06s, box-shadow 0.06s; white-space: nowrap; }
.btn:active, .btn.down { transform: skewX(-8deg) translate(0.18rem, 0.18rem); box-shadow: 0.08rem 0.08rem 0 var(--ink); }
.btn.go { background: var(--yellow); }
.btn.small { min-height: 2.2rem; font-size: 1.05rem; padding: 0.2rem 0.9rem; }
.btn.red { background: var(--red); color: var(--plate); }
.btn[disabled] { opacity: 0.45; }
.round { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: rgba(23, 26, 34, 0.72); border: 0.14rem solid var(--plate); display: inline-flex; align-items: center; justify-content: center; }
.round svg { width: 1.3rem; height: 1.3rem; }
.round:active { background: var(--yellow); }
.round:active svg { stroke: var(--ink); fill: var(--ink); }
.back { position: absolute; left: calc(1rem + var(--safe-l)); top: calc(0.7rem + var(--safe-t)); }
h2 { font-size: 1.9rem; font-style: italic; font-weight: 900; margin: 0; line-height: 1; letter-spacing: 0.01em; text-shadow: 0.14rem 0.14rem 0 var(--ink); }
.head { display: flex; align-items: center; gap: 1rem; height: 2.7rem; padding-left: 3.6rem; }
.head .fill { flex: 1; }
.count { font-weight: 800; font-style: italic; font-size: 1.15rem; display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(23, 26, 34, 0.7); padding: 0.2rem 0.8rem; border-radius: 2rem; border: 0.12rem solid var(--plate); }
.star { display: inline-block; width: 1em; height: 1em; background: currentColor; clip-path: polygon(50% 2%, 62% 36%, 98% 37%, 69% 59%, 80% 94%, 50% 73%, 20% 94%, 31% 59%, 2% 37%, 38% 36%); }
.stars { display: inline-flex; gap: 0.12em; color: rgba(23, 26, 34, 0.22); }
.stars .on { color: var(--yellow); filter: drop-shadow(0.05em 0.05em 0 var(--ink)); }

/* title */
#s-title .logo { position: absolute; left: calc(1.6rem + var(--safe-l)); top: 9%; transform: rotate(-5deg) skewX(-8deg); transform-origin: left top; }
.logo .slab { background: var(--yellow); border: 0.24rem solid var(--ink); border-radius: 0.7rem; box-shadow: 0.5rem 0.5rem 0 var(--ink); padding: 0.5rem 1.6rem 0.3rem 1.3rem; color: var(--ink); font-weight: 900; font-style: italic; line-height: 0.84; font-size: 4.3rem; letter-spacing: -0.01em; }
.logo .slab b { display: block; font-weight: 900; }
.logo .slab b + b { margin-left: 1.6rem; }
.logo .tread { height: 0.7rem; margin: 0.5rem 0 0 0.6rem; width: 62%; background: repeating-linear-gradient(115deg, var(--plate) 0 0.42rem, transparent 0.42rem 0.84rem); opacity: 0.9; }
.logo .tag { margin: 0.45rem 0 0 0.7rem; font-size: 1.1rem; font-weight: 700; font-style: italic; color: var(--plate); text-shadow: 0.1rem 0.1rem 0 var(--ink); }
#s-title .menu { position: absolute; right: calc(2.2rem + var(--safe-r)); bottom: calc(1.6rem + var(--safe-b)); display: flex; flex-direction: column; gap: 0.75rem; align-items: stretch; width: 15rem; }
#s-title .menu .btn.go { font-size: 2rem; min-height: 3.8rem; }
#s-title .foot { position: absolute; left: calc(1.2rem + var(--safe-l)); bottom: calc(0.8rem + var(--safe-b)); font-size: 0.9rem; font-style: italic; opacity: 0.85; text-shadow: 0.08rem 0.08rem 0 var(--ink); max-width: 46%; line-height: 1.25; }
#s-title .fs { position: absolute; right: calc(1rem + var(--safe-r)); top: calc(0.7rem + var(--safe-t)); }

/* track select */
.tabs { display: flex; gap: 0.5rem; margin: 0.45rem 0 0.4rem; }
.tab { flex: 1; min-width: 0; padding: 0.3rem 0.4rem 0.25rem; border-radius: 0.45rem; border: 0.14rem solid var(--ink); background: rgba(246, 242, 231, 0.2); color: var(--plate); transform: skewX(-8deg); text-align: left; line-height: 1.05; }
.tab b { display: block; font-size: 1.05rem; font-style: italic; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab i { display: block; font-size: 0.72rem; font-weight: 600; opacity: 0.9; white-space: nowrap; }
.tab.on { background: var(--plate); color: var(--ink); box-shadow: 0.2rem 0.2rem 0 var(--ink); }
.tab.locked { opacity: 0.75; }
.wsub { font-size: 0.86rem; font-style: italic; opacity: 0.92; margin: 0 0 0.35rem 0.2rem; line-height: 1.1; text-shadow: 0.08rem 0.08rem 0 var(--ink); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem 0.8rem; }
.card { position: relative; height: 5.15rem; text-align: left; border-radius: 0.5rem; border: 0.16rem solid var(--ink); box-shadow: 0.24rem 0.24rem 0 var(--ink); background: var(--plate); color: var(--ink); overflow: hidden; padding: 0; display: block; width: 100%; }
.card:active { transform: translate(0.14rem, 0.14rem); box-shadow: 0.1rem 0.1rem 0 var(--ink); }
.card canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 62%; }
.card .num { position: absolute; left: 0.45rem; top: 0.1rem; font-size: 2.1rem; font-weight: 900; font-style: italic; line-height: 1; }
.card .nm { position: absolute; left: 1.9rem; top: 0.42rem; right: 0.3rem; font-size: 0.92rem; font-weight: 800; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { position: absolute; left: 1.9rem; top: 1.5rem; font-size: 0.86rem; }
.card .bt { position: absolute; right: 0.4rem; bottom: 0.22rem; font-size: 0.9rem; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; background: var(--ink); color: var(--plate); padding: 0 0.4rem; border-radius: 0.3rem; }
.card.locked { background: #8d8a84; color: rgba(23, 26, 34, 0.6); }
.card.locked canvas { opacity: 0.25; }
.card .lock { position: absolute; right: 0.5rem; top: 0.45rem; width: 1.3rem; height: 1.3rem; }
.lockmsg { margin-top: 0.55rem; font-size: 0.95rem; line-height: 1.1; font-style: italic; font-weight: 700; text-shadow: 0.08rem 0.08rem 0 var(--ink); }

/* garage */
#s-garage .stageL { position: absolute; left: calc(1rem + var(--safe-l)); top: calc(3.6rem + var(--safe-t)); bottom: calc(3.9rem + var(--safe-b)); width: 53%; }
#s-garage .stageL canvas { width: 100%; height: 100%; display: block; }
#s-garage .spec { position: absolute; right: calc(1rem + var(--safe-r)); top: calc(3.4rem + var(--safe-t)); bottom: calc(0.8rem + var(--safe-b)); width: 41%; padding: 0.5rem 0.9rem 0.6rem; display: flex; flex-direction: column; overflow: hidden; }
.spec h3 { margin: 0; font-size: 1.75rem; font-weight: 900; font-style: italic; line-height: 1; }
.spec .tag { font-size: 0.95rem; font-weight: 800; font-style: italic; color: var(--blue); margin-top: 0.1rem; }
.spec p { margin: 0.25rem 0 0.35rem; font-size: 0.82rem; line-height: 1.2; font-weight: 500; }
.bars { display: grid; grid-template-columns: auto 1fr; gap: 0.08rem 0.6rem; align-items: center; font-size: 0.76rem; font-weight: 700; line-height: 1.15; }
.bar { height: 0.5rem; background: rgba(23, 26, 34, 0.14); border-radius: 0.3rem; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 0.3rem; }
.spec .fill { flex: 1; min-height: 0.3rem; }
.spec .btn { min-height: 2.3rem; font-size: 1.2rem; flex: none; }
.need { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.35rem; line-height: 1.15; }
.need .bar { margin-top: 0.2rem; height: 0.5rem; }
.need .bar i { background: var(--red); }
#s-garage .pick { position: absolute; left: calc(1rem + var(--safe-l)); bottom: calc(0.8rem + var(--safe-b)); width: 53%; display: flex; align-items: center; gap: 0.5rem; }
.dots { flex: 1; display: flex; justify-content: center; gap: 0.32rem; flex-wrap: nowrap; }

<body>
<canvas id="stage"></canvas>
<div id="ui"></div>
<script>
/* ---- physics.js ---- */
/* Ridge Riot: physics core.
   No drawing and no browser APIs in here, so the same file runs in the game
   and in the Node test tools (tools/bot.js).

   Model: three rigid bodies (chassis + rider, rear wheel, front wheel).
   Each wheel slides along a suspension axis on the chassis (spring + damper,
   bump stops at both ends) and is held on that axis by an impulse constraint.
   Tyres are soft (spring + damper against the ground) with Coulomb friction,
   so drive, braking, wheelspin, wheelies and stoppies all come out of the
   same contact forces instead of being scripted.
   Units: metres, kilograms, seconds. Y is up. Angles are counter-clockwise,
   so a backflip is positive rotation and a frontflip is negative. */
(function (root) {
'use strict';
var RR = root.RR || (root.RR = {});
var PI = Math.PI, TAU = PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
RR.clamp = clamp;

/* Surface materials: mu = grip multiplier, roll = rolling drag, */
RR.MATS = [
  { id: 'dirt',  mu: 1.00, roll: 0.016 },
  { id: 'rock',  mu: 1.05, roll: 0.012 },
  { id: 'ice',   mu: 0.20, roll: 0.006 },
  { id: 'sand',  mu: 0.85, roll: 0.050 },
  { id: 'wood',  mu: 0.95, roll: 0.012 },
  { id: 'steel', mu: 1.15, roll: 0.010 },
  { id: 'snow',  mu: 0.62, roll: 0.030 },
  { id: 'dust',  mu: 0.92, roll: 0.020 }
];
RR.MAT = { dirt: 0, rock: 1, ice: 2, sand: 3, wood: 4, steel: 5, snow: 6, dust: 7 };

/* ------------------------------------------------------------------ */
/* Collision geometry: directed line segments, solid on the right-hand */
/* side of travel (the normal is the left-hand side).                  */
/* ------------------------------------------------------------------ */
RR.buildCollision = function (chains) {
  var n = 0, c, i;
  for (c = 0; c < chains.length; c++) {
    n += chains[c].pts.length / 2 - 1 + (chains[c].closed ? 1 : 0);
  }
  var col = {
    n: 0,
    ax: new Float64Array(n), ay: new Float64Array(n),
    bx: new Float64Array(n), by: new Float64Array(n),
    dx: new Float64Array(n), dy: new Float64Array(n),
    len: new Float64Array(n), depth: new Float64Array(n),
    mat: new Uint8Array(n), gate: new Int16Array(n), side: new Uint8Array(n),
    next: new Int32Array(n), prev: new Int32Array(n), cvx: new Uint8Array(n),
    mark: new Int32Array(n), stamp: 0
  };
  var k = 0, minX = 1e9, maxX = -1e9;
  for (c = 0; c < chains.length; c++) {
    var ch = chains[c], p = ch.pts, m = p.length / 2, first = k, cnt = ch.closed ? m : m - 1;
    for (i = 0; i < cnt; i++) {
      var j = (i + 1) % m;
      var x0 = p[i * 2], y0 = p[i * 2 + 1], x1 = p[j * 2], y1 = p[j * 2 + 1];
      var L = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (L < 1e-6) continue;
      col.ax[k] = x0; col.ay[k] = y0; col.bx[k] = x1; col.by[k] = y1;
      col.dx[k] = (x1 - x0) / L; col.dy[k] = (y1 - y0) / L; col.len[k] = L;
      col.depth[k] = ch.depth || 0.4;
      col.mat[k] = ch.mats ? ch.mats[i] : (ch.mat || 0);
      col.gate[k] = ch.gate == null ? -1 : ch.gate;
      col.side[k] = ch.side == null ? 2 : ch.side;
      col.prev[k] = k > first ? k - 1 : -1;
      col.next[k] = -1;
      if (k > first) col.next[k - 1] = k;
      if (x0 < minX) minX = x0; if (x1 < minX) minX = x1;
      if (x0 > maxX) maxX = x0; if (x1 > maxX) maxX = x1;
      k++;
    }
    if (ch.closed && k > first) { col.next[k - 1] = first; col.prev[first] = k - 1; }
  }
  col.n = k;
  for (i = 0; i < k; i++) {
    var nx = col.next[i];
    if (nx < 0) col.cvx[i] = 1;
    else col.cvx[i] = (col.dx[i] * col.dy[nx] - col.dy[i] * col.dx[nx]) < -1e-9 ? 1 : 0;
  }
  // buckets along x
  col.cw = 2.5; col.x0 = minX - 1; col.nc = Math.max(1, Math.ceil((maxX - minX + 2) / col.cw));
  var cells = []; for (i = 0; i < col.nc; i++) cells.push([]);
  for (i = 0; i < k; i++) {
    var a = Math.min(col.ax[i], col.bx[i]), b = Math.max(col.ax[i], col.bx[i]);
    var c0 = Math.max(0, Math.floor((a - col.x0) / col.cw)), c1 = Math.min(col.nc - 1, Math.floor((b - col.x0) / col.cw));
    for (c = c0; c <= c1; c++) cells[c].push(i);
  }
  col.cells = cells;
  return col;
};

function Contacts() {
  this.nx = new Float64Array(8); this.ny = new Float64Array(8);
  this.pen = new Float64Array(8); this.mat = new Uint8Array(8); this.n = 0;
}
RR.Contacts = Contacts;

/* Find every surface a circle is pressing into.
   If the centre has ended up inside the ground, only the nearest face pushes it
   back out. Letting every face push at once is what makes things explode. */
function query(col, px, py, r, gates, C) {
  var n = 0;
  var c0 = Math.floor((px - r - col.x0) / col.cw), c1 = Math.floor((px + r - col.x0) / col.cw);
  if (c0 < 0) c0 = 0; if (c1 >= col.nc) c1 = col.nc - 1;
  var stamp = ++col.stamp;
  var inD = 1e9, inNx = 0, inNy = 0, inMat = 0;
  for (var c = c0; c <= c1; c++) {
    var cell = col.cells[c];
    for (var q = 0; q < cell.length; q++) {
      var i = cell[q];
      if (col.mark[i] === stamp) continue;
      col.mark[i] = stamp;
      var g = col.gate[i];
      if (g >= 0 && col.side[i] !== 2 && gates[g] !== col.side[i]) continue;
      var dx = col.dx[i], dy = col.dy[i];
      var rx = px - col.ax[i], ry = py - col.ay[i];
      var d = -rx * dy + ry * dx;                 // signed distance from the surface line
      if (d >= r || d <= -col.depth[i]) continue;
      var t = rx * dx + ry * dy, L = col.len[i];
      if (t < -r || t > L + r) continue;
      var onx, ony, pen;
      if (t >= 0 && t <= L) {
        if (d < 0) {
          // The centre is behind this face. That only counts if it is really inside the
          // ground, so check the face across the nearer corner when that corner sticks out.
          var nearStart = t < L * 0.5, kk = nearStart ? col.prev[i] : col.next[i];
          if (kk >= 0 && (nearStart ? col.cvx[kk] : col.cvx[i])) {
            if (-(px - col.ax[kk]) * col.dy[kk] + (py - col.ay[kk]) * col.dx[kk] > 0) continue;
          }
          if (-d < inD) { inD = -d; inNx = -dy; inNy = dx; inMat = col.mat[i]; }
          continue;
        }
        onx = -dy; ony = dx; pen = r - d;
      }
      else if (t > L) {
        var j = col.next[i];
        var vx = px - col.bx[i], vy = py - col.by[i];
        var t2 = j >= 0 ? vx * col.dx[j] + vy * col.dy[j] : -1;
        if (t2 >= 0) continue;                    // the next segment owns this point
        var dist = Math.sqrt(vx * vx + vy * vy);
        if (j < 0 || col.cvx[i]) {                // outside corner or loose end
          if (dist >= r) continue;
          if (dist > 1e-6) { onx = vx / dist; ony = vy / dist; } else { onx = -dy; ony = dx; }
          pen = r - dist;
        } else {                                  // sunk into an inside corner
          if (dist >= col.depth[i]) continue;
          onx = -dy - col.dy[j]; ony = dx + col.dx[j];
          var nl = Math.sqrt(onx * onx + ony * ony) || 1; onx /= nl; ony /= nl;
          if (dist < inD) { inD = dist; inNx = onx; inNy = ony; inMat = col.mat[i]; }
          continue;
        }
      } else {
        if (col.prev[i] >= 0) continue;           // the previous segment owns its end corner
        var wx = rx, wy = ry, dd = Math.sqrt(wx * wx + wy * wy);
        if (dd >= r) continue;
        if (dd > 1e-6) { onx = wx / dd; ony = wy / dd; } else { onx = -dy; ony = dx; }
        pen = r - dd;
      }
      if (n < 7) { C.nx[n] = onx; C.ny[n] = ony; C.pen[n] = pen; C.mat[n] = col.mat[i]; n++; }
    }
  }
  if (inD < 1e8) { n = 0; C.nx[0] = inNx; C.ny[0] = inNy; C.pen[0] = r + inD; C.mat[0] = inMat; n = 1; }
  C.n = n;
  return n;
}
RR.queryCircle = query;

/* ------------------------------------------------------------------ */
/* Bike set-up: turns a readable bike description into physics numbers */
/* ------------------------------------------------------------------ */
var G0 = 9.81;
RR.prepBike = function (def) {
  var b = { def: def, id: def.id };
  var mw = [def.wheelMass[0], def.wheelMass[1]];
  b.M = def.mass;                                   // chassis + rider
  b.Mtot = def.mass + mw[0] + mw[1];
  b.I = b.M * def.kgyr * def.kgyr;
  b.com = [def.com[0], def.com[1]];
  b.wb = def.wb;
  var rr = def.rr, rf = def.rf;
  var loadF = b.M * G0 * def.com[0] / def.wb, loadR = b.M * G0 - loadF;
  var rake = (def.rake || 27) * PI / 180, sw = (def.swing || 9) * PI / 180;
  var axes = [[Math.sin(sw), Math.cos(sw)], [-Math.sin(rake), Math.cos(rake)]];
  var axle = [[0, rr], [def.wb, rf]], loads = [loadR, loadF], rad = [rr, rf];
  var sus = [def.sus[0], def.sus[1]];
  b.wh = [];
  for (var i = 0; i < 2; i++) {
    var s = sus[i], u = axes[i];
    var mEff = loads[i] / G0;
    var k = mEff * Math.pow(TAU * s.freq, 2);
    var F = loads[i] / u[1];
    var sag = s.sag * s.travel, pre = F / k - sag;
    if (pre < 0) { pre = 0; sag = F / k; }
    var cc = 2 * Math.sqrt(k * mEff);
    var Iw = 0.8 * mw[i] * rad[i] * rad[i];
    b.wh.push({
      r: rad[i], m: mw[i], I: Iw, meff: 1 / (1 / mw[i] + rad[i] * rad[i] / Iw),
      ux: u[0], uy: u[1],
      ax: axle[i][0] - u[0] * sag - def.com[0], ay: axle[i][1] - u[1] * sag - def.com[1],
      travel: s.travel, sag: sag, k: k, pre: pre, cc: cc * s.zc, cr: cc * s.zr,
      kp: 1.6 * k / (0.3 * s.travel * 0.3)          // rising rate over the last 30% of travel
    });
  }
  b.thrust = def.accel * b.Mtot * G0;               // peak push at the rear tyre, newtons
  b.vp = def.vp; b.vmax = def.vmax;
  b.mu = def.grip;
  b.brake = [def.brake * 0.42 * b.Mtot * G0 * rr, def.brake * 0.58 * b.Mtot * G0 * rf];
  var Isys = b.I + mw[0] * (def.com[0] * def.com[0] + 0.2) + mw[1] * (Math.pow(def.wb - def.com[0], 2) + 0.2);
  b.Isys = Isys;
  b.leanTq = def.leanAcc * Isys;
  b.spin = def.spin; b.groundSpin = def.groundSpin || 2.3;
  b.airDamp = def.airDamp == null ? 1.1 : def.airDamp;
  b.leanGround = def.leanGround == null ? 0.75 : def.leanGround;
  b.reaction = def.reaction == null ? 1 : def.reaction;
  b.kd = 0.5 * 1.2 * (def.cda || 0.55);
  b.rocket = (def.rocket || 0) * b.Mtot * G0; b.rocketV = def.rocketV || 24;
  b.tip = Math.atan2(def.com[0], def.com[1] - rr) + 0.08;   // pitch where the bike balances on the rear wheel
  b.ebrake = def.ebrake == null ? 0.05 : def.ebrake;
  b.pts = [];
  for (i = 0; i < def.body.length; i++) b.pts.push([def.body[i][0] - def.com[0], def.body[i][1] - def.com[1], def.body[i][2]]);
  b.headR = 0.15 * (def.rider.scale || 1);
  return b;
};

/* Where the rider's hips, shoulders and head are, in bike design coordinates

  if (tier !== lastGoal) { lastGoal = tier; $('goal').innerHTML = stars(tier) + '<span>' + (tier === 3 ? 'under ' + fmt(st[0]) : tier === 2 ? 'under ' + fmt(st[1]) : 'just finish') + '</span>'; }

  if (pads !== lastPads) { lastPads = pads; $('padB').className = 'pad b' + (In.L ? ' on' : ''); $('padF').className = 'pad f' + (In.R ? ' on' : ''); $('padG').className = 'pad g' + (In.G && !In.B ? ' on' : ''); $('padK').className = 'pad k' + (In.B ? ' on' : ''); }
  var bo = $('boost');
  if (s.boost > 0) { bo.style.opacity = 1; $('boostI').style.width = Math.min(100, s.boost / 3.2 * 100) + '%'; } else if (bo.style.opacity !== '0') bo.style.opacity = 0;
};

UI.results = function (r) {
  var i = r.track, info = RR.trackInfo(i), st = RR.STAR_TIMES[i], h, k;
  var next = i + 1 < RR.TRACK_COUNT && P.trackOpen(i + 1) ? i + 1 : -1;
  h = '<div class="tn">' + esc(RR.WORLDS[info.world].name) + ' ' + (info.num + 1) + ', ' + esc(info.name) + '</div><div class="time">' + fmt(r.time) + '</div>' +
      '<div class="big"><i class="star" id="rs0"></i><i class="star" id="rs1"></i><i class="star" id="rs2"></i></div>';
  var line;
  if (r.best && r.old) line = '<b>New best</b> ' + fmt(r.old - r.time) + ' quicker than before';
  else if (r.best) line = '<b>First finish</b>';
  else line = 'Your best is ' + fmt(r.old) + ', this was ' + fmt(r.time - r.old) + ' off it';
  h += '<div class="line">' + line + '</div>';
  h += '<div class="line">' + (r.stars === 3 ? 'All three stars. Nothing left to prove here.' : r.stars === 2 ? 'Three stars needs under ' + fmt(st[0]) + '.' : 'Two stars needs under ' + fmt(st[1]) + ', three needs under ' + fmt(st[0]) + '.') + '</div>';
  for (k = 0; k < r.bikes.length; k++) h += '<div class="unl">New bike in the garage: ' + esc(r.bikes[k].name) + '</div>';
  for (k = 0; k < r.worlds.length; k++) h += '<div class="unl">New world open: ' + esc(r.worlds[k].name) + '</div>';
  h += '<div class="btns">' + (next >= 0 ? '<button class="btn go" data-act="nextTrack" data-i="' + next + '">Next track</button>' : '') +
       '<button class="btn' + (next >= 0 ? '' : ' go') + '" data-act="retry">Ride it again</button><button class="btn small" data-act="garage">Garage</button><button class="btn small" data-act="quit">Tracks</button></div>';
  $('res').innerHTML = h;
  UI.show('results');
  for (k = 0; k < r.stars; k++) (function (n) { setTimeout(function () { var e = $('rs' + n); if (e && UI.cur === 'results') { e.className = 'star on'; Au.star(n); } }, 350 + n * 330); })(k);
  setTimeout(function () { if (UI.cur !== 'results') return; if (r.bikes.length || r.worlds.length) Au.unlocked(); else if (r.best && r.old) Au.newBest(); }, 350 + r.stars * 330 + 150);
};

/* ------------------------------------------------------------------ */
RR.boot = function () {
  Store.load();
  P.claim();
  R.init($('stage'));
  UI.init();
  G.menu();
  UI.title();
  root.requestAnimationFrame(G.frame);
};
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>RR.boot();</script>
</body>
</html>
