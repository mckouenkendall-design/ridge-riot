<style>
/* Ridge Riot: menus and on-screen display.
   The look is borrowed from race number plates and paddock stickers:
   slanted plates, thick ink outlines, hard offset shadows. */
:root {
  color-scheme: dark;
  --ink: #171a22; --plate: #f6f2e7; --yellow: #f2c230; --red: #e2402f; --blue: #2f6fd6; --dim: rgba(23, 26, 34, 0.62);
  --common: #b8c0cc; --uncommon: #3fbf6a; --rare: #3b8cf0; --epic: #a259ee; --legendary: #ff9a1f; --trophy: #ffd23f;
  --font: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "HelveticaNeue-CondensedBold", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(10px, min(4.5vh, 2.15vw), 30px); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { font-family: var(--font); color: var(--plate); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: none; padding: calc(0.7rem + var(--safe-t)) calc(1rem + var(--safe-r)) calc(0.7rem + var(--safe-b)) calc(1rem + var(--safe-l)); pointer-events: auto; }
.screen.on { display: block; }
.screen.col.on { display: flex; flex-direction: column; }
.shade { background: linear-gradient(90deg, rgba(23, 26, 34, 0.82), rgba(23, 26, 34, 0.5)); }
.shade.full { background: rgba(23, 26, 34, 0.8); }
#s-garage.shade.full { background: rgba(23, 26, 34, 0.9); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: none; }
.cols, .cols button, .cols .row, .cols label { touch-action: pan-y; }
button:focus-visible, [tabindex]:focus-visible { outline: 0.18rem solid var(--yellow); outline-offset: 0.2rem; }

/* plates and buttons */
.plate { background: var(--plate); color: var(--ink); border: 0.16rem solid var(--ink); border-radius: 0.5rem; box-shadow: 0.26rem 0.26rem 0 var(--ink); }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 2.7rem; padding: 0.35rem 1.4rem; font-weight: 900; font-style: italic; font-size: 1.35rem; letter-spacing: 0.02em;
  background: var(--plate); color: var(--ink); border: 0.16rem solid var(--ink); border-radius: 0.5rem; box-shadow: 0.26rem 0.26rem 0 var(--ink); transform: skewX(-8deg); transition: box-shadow 0.06s, filter 0.06s; white-space: nowrap; }
/* pressed: the shadow tucks in and the face darkens. The button itself does not move, so the finger never slips off it. */
.btn:active, .btn.down { box-shadow: 0.06rem 0.06rem 0 var(--ink); filter: brightness(0.86); }
.btn.go { background: var(--yellow); }
.btn.small { min-height: 2.45rem; font-size: 1.05rem; padding: 0.2rem 0.9rem; }
.btn.red { background: var(--red); color: var(--plate); }
.btn.gem { background: var(--blue); color: var(--plate); }
.btn[disabled] { opacity: 0.5; }
.round { position: relative; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: rgba(23, 26, 34, 0.72); border: 0.14rem solid var(--plate); display: inline-flex; align-items: center; justify-content: center; }
.round svg { width: 1.3rem; height: 1.3rem; }
.round:active, .round.down { background: var(--yellow); }
.round:active svg, .round.down svg { stroke: var(--ink); fill: var(--ink); }
/* every round or back button answers to touches a little outside what you can see */
.round::after, .back::after { content: ""; position: absolute; inset: -0.7rem; }
.back { position: relative; flex: none; height: 2.6rem; padding: 0 1.1rem 0 0.6rem; display: inline-flex; align-items: center; gap: 0.25rem; border-radius: 1.4rem; background: rgba(23, 26, 34, 0.72); border: 0.14rem solid var(--plate);
  font-weight: 900; font-style: italic; font-size: 1.15rem; color: var(--plate); }
.back svg { width: 1.3rem; height: 1.3rem; flex: none; }
.back:active, .back.down { background: var(--yellow); color: var(--ink); }
.back:active svg, .back.down svg { stroke: var(--ink); }
h2 { font-size: 1.9rem; font-style: italic; font-weight: 900; margin: 0; line-height: 1; letter-spacing: 0.01em; text-shadow: 0.14rem 0.14rem 0 var(--ink); white-space: nowrap; }
h3 { margin: 0; font-size: 1.5rem; font-weight: 900; font-style: italic; line-height: 1; }
.head { flex: none; display: flex; align-items: center; gap: 0.8rem; height: 2.7rem; }
.head .fill { flex: 1; }
.count { flex: none; font-weight: 800; font-style: italic; font-size: 1.15rem; display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(23, 26, 34, 0.7); padding: 0.2rem 0.8rem; border-radius: 2rem; border: 0.12rem solid var(--plate); font-variant-numeric: tabular-nums; }
.star { display: inline-block; width: 1em; height: 1em; background: currentColor; clip-path: polygon(50% 2%, 62% 36%, 98% 37%, 69% 59%, 80% 94%, 50% 73%, 20% 94%, 31% 59%, 2% 37%, 38% 36%); }
.stars { display: inline-flex; gap: 0.12em; color: rgba(23, 26, 34, 0.22); }
.stars .on { color: var(--yellow); filter: drop-shadow(0.05em 0.05em 0 var(--ink)); }
/* a gold nugget */
.nug { display: inline-block; width: 1em; height: 0.9em; flex: none; background: linear-gradient(135deg, #fff3b0 0 30%, #f2b632 30% 62%, #b9801a 62%); clip-path: polygon(22% 4%, 70% 0, 100% 34%, 88% 86%, 44% 100%, 6% 78%, 0 34%); }
.dotb { display: inline-block; width: 0.62rem; height: 0.62rem; border-radius: 50%; background: var(--red); border: 0.1rem solid var(--ink); margin-left: 0.35rem; vertical-align: 0.5em; }
/* rarity colours. Legendary and trophy keep moving (the shift is done by the browser, so it runs at the screen's own rate). */
.chip { display: inline-block; flex: none; padding: 0.02rem 0.55rem 0; border-radius: 1rem; border: 0.1rem solid var(--ink); font-weight: 900; font-style: italic; font-size: 0.8rem; color: var(--ink); white-space: nowrap; line-height: 1.25; }
.t-common { --tc: var(--common); --tl: #f2f5f9; } .t-uncommon { --tc: var(--uncommon); --tl: #b6f5c8; } .t-rare { --tc: var(--rare); --tl: #bcdcff; } .t-epic { --tc: var(--epic); --tl: #e0c6ff; }
.t-legendary { --tc: #ff9a1f; --tl: #ffe0a8; } .t-trophy { --tc: #f2b632; --tl: #fff7cf; }
.chip.t-common, .chip.t-uncommon, .chip.t-rare, .chip.t-epic { background: linear-gradient(135deg, var(--tl), var(--tc) 55%); }
.chip.t-rare, .chip.t-epic { color: #fff; text-shadow: 0.05rem 0.05rem 0 var(--ink); }
.chip.t-legendary, .tile.item.t-legendary, .cratecard.t-legendary #crateitem { background: linear-gradient(120deg, #ffd9a0, #ff9a1f, #ff6fb0, #ffe27a, #ff9a1f, #ffd9a0, #ff9a1f); background-size: 300% 100%; animation: shimmer 3.2s linear infinite; }
.chip.t-trophy, .tile.item.t-trophy { background: linear-gradient(115deg, #fff7cf, #ffd23f 30%, #fff7cf 45%, #e9a31c 60%, #ffd23f 80%, #fff7cf); background-size: 300% 100%; animation: shimmer 2.6s linear infinite; }
.cratecard.t-trophy #crateitem { background: linear-gradient(160deg, #fff7cf, #f2b632); }
@keyframes shimmer { from { background-position: 0 0; } to { background-position: 150% 0; } }

/* title */
#s-title .logo { position: absolute; left: calc(1.6rem + var(--safe-l)); top: 8%; transform: rotate(-5deg); transform-origin: left top; }
.logo .slab { display: flex; flex-direction: column; align-items: flex-start; gap: 0.42rem; background: var(--yellow); border: 0.24rem solid var(--ink); border-radius: 0.7rem; box-shadow: 0.5rem 0.5rem 0 var(--ink); padding: 0.75rem 1.5rem 0.75rem 1.0rem; transform: skewX(-6deg); }
.logo .word { display: block; height: 3.25rem; width: auto; }
.logo .word + .word { margin-left: 1.5rem; }
.logo .tread { height: 0.7rem; margin: 0.6rem 0 0 0.4rem; width: 62%; background: repeating-linear-gradient(115deg, var(--plate) 0 0.42rem, transparent 0.42rem 0.84rem); opacity: 0.9; }
.logo .tag { margin: 0.45rem 0 0 0.5rem; font-size: 1.1rem; font-weight: 700; font-style: italic; color: var(--plate); text-shadow: 0.1rem 0.1rem 0 var(--ink); }
#s-title .menu { position: absolute; right: calc(2.2rem + var(--safe-r)); bottom: calc(1.6rem + var(--safe-b)); display: flex; flex-direction: column; gap: 0.75rem; align-items: stretch; width: 15rem; }
#s-title .menu .btn.go { font-size: 2rem; min-height: 3.8rem; }
#s-title .foot { position: absolute; left: calc(1.2rem + var(--safe-l)); bottom: calc(0.8rem + var(--safe-b)); font-size: 0.9rem; font-style: italic; opacity: 0.9; text-shadow: 0.08rem 0.08rem 0 var(--ink); max-width: 50%; line-height: 1.25; }
#s-title .fs { position: absolute; right: calc(1rem + var(--safe-r)); top: calc(0.7rem + var(--safe-t)); }

/* track select */
.tabs { flex: none; display: flex; gap: 0.4rem; margin: 0.45rem 0 0.35rem; }
.tab { flex: 1; min-width: 0; padding: 0.34rem 0.3rem 0.28rem 0.42rem; border-radius: 0.45rem; border: 0.14rem solid var(--ink); background: rgba(246, 242, 231, 0.2); color: var(--plate); transform: skewX(-8deg); text-align: left; line-height: 1.05; }
.tab b { display: block; font-size: 0.88rem; font-style: italic; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab i { display: block; font-size: 0.72rem; font-weight: 600; opacity: 0.9; white-space: nowrap; overflow: hidden; }
.tab.on { background: var(--plate); color: var(--ink); box-shadow: 0.2rem 0.2rem 0 var(--ink); }
.tab.locked { opacity: 0.75; }
.tab.down { filter: brightness(0.86); }
.wsub { flex: none; font-size: 0.86rem; font-style: italic; opacity: 0.92; margin: 0 0 0.35rem 0.2rem; line-height: 1.1; text-shadow: 0.08rem 0.08rem 0 var(--ink); }
.grid { flex: 1 1 auto; min-height: 0; max-height: 11.2rem; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 0.6rem 0.8rem; }
.card { position: relative; min-height: 0; text-align: left; border-radius: 0.5rem; border: 0.16rem solid var(--ink); box-shadow: 0.24rem 0.24rem 0 var(--ink); background: var(--plate); color: var(--ink); overflow: hidden; padding: 0; display: block; width: 100%; }
.card:active, .card.down { box-shadow: 0.08rem 0.08rem 0 var(--ink); filter: brightness(0.88); }
.card canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 58%; }
.card .num { position: absolute; left: 0.45rem; top: 0.1rem; font-size: 2.1rem; font-weight: 900; font-style: italic; line-height: 1; }
.card .nm { position: absolute; left: 1.75rem; top: 0.45rem; right: 0.2rem; font-size: 0.84rem; font-weight: 800; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { position: absolute; left: 1.75rem; top: 1.5rem; font-size: 0.86rem; }
.card .bt { position: absolute; right: 0.4rem; bottom: 0.22rem; font-size: 0.9rem; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; background: var(--ink); color: var(--plate); padding: 0 0.4rem; border-radius: 0.3rem; }
.card.locked { background: #8d8a84; color: rgba(23, 26, 34, 0.6); }
.card.locked canvas { opacity: 0.25; }
.card .lock { position: absolute; right: 0.5rem; top: 0.45rem; width: 1.3rem; height: 1.3rem; }
.lockmsg { flex: none; margin-top: 0.5rem; min-height: 1.1rem; font-size: 0.95rem; line-height: 1.1; font-style: italic; font-weight: 700; text-shadow: 0.08rem 0.08rem 0 var(--ink); }

/* garage */
.gtabs { display: flex; gap: 0.25rem; min-width: 0; }
.gtab { height: 2.4rem; padding: 0 0.62rem; border-radius: 0.45rem; border: 0.14rem solid var(--ink); background: rgba(246, 242, 231, 0.2); color: var(--plate); transform: skewX(-8deg); font-weight: 900; font-style: italic; font-size: 1.02rem; white-space: nowrap; }
.gtab.on { background: var(--plate); color: var(--ink); box-shadow: 0.2rem 0.2rem 0 var(--ink); }
.gtab.down { filter: brightness(0.86); }
.gbody { flex: 1; min-height: 0; display: flex; gap: 0.9rem; margin-top: 0.55rem; }
.gleft { flex: 0 0 38%; min-width: 0; display: flex; flex-direction: column; }
.gleft canvas { flex: 1; min-height: 0; width: 100%; display: block; }
.gcap { flex: none; height: 5.5rem; overflow: hidden; font-size: 0.8rem; line-height: 1.16; font-weight: 500; opacity: 0.95; }
.gcap b { display: block; font-size: 1.05rem; font-weight: 900; font-style: italic; line-height: 1.1; }

<script>
/* ---- physics.js ---- */
/* Ridge Riot: physics core.
   No drawing and no browser APIs in here, so the same file runs in the game
   and in the Node test tools (tools/bot.js).

   Model: three rigid bodies (chassis + rider, rear wheel, front wheel).
   Each wheel slides along a suspension axis on the chassis (spring + damper,
   bump stops at both ends) and is held on that axis by an impulse constraint.
   Tyres are soft (spring + damper against the ground) with Coulomb friction,
   so drive, braking, wheelspin, wheelies and stoppies all come out of the
   same contact forces instead of being scripted.
   Units: metres, kilograms, seconds. Y is up. Angles are counter-clockwise,
   so a backflip is positive rotation and a frontflip is negative. */
(function (root) {
'use strict';
var RR = root.RR || (root.RR = {});
var PI = Math.PI, TAU = PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrap(a) { return a - TAU * Math.round(a / TAU); }
RR.clamp = clamp;

/* Surface materials: mu = grip multiplier, roll = rolling drag, */
RR.MATS = [
  { id: 'dirt',  mu: 1.00, roll: 0.016 },
  { id: 'rock',  mu: 1.05, roll: 0.012 },
  { id: 'ice',   mu: 0.20, roll: 0.006 },
  { id: 'sand',  mu: 0.85, roll: 0.050 },
  { id: 'wood',  mu: 0.95, roll: 0.012 },
  { id: 'steel', mu: 1.15, roll: 0.010 },
  { id: 'snow',  mu: 0.62, roll: 0.030 },
  { id: 'dust',  mu: 0.92, roll: 0.020 },
  { id: 'tarmac', mu: 1.12, roll: 0.008 },
  { id: 'kerb',  mu: 1.00, roll: 0.014 },
  { id: 'oil',   mu: 0.13, roll: 0.004 },
  { id: 'boost', mu: 1.20, roll: 0.006 },    // boost strip: see tick()
  { id: 'rubber', mu: 1.05, roll: 0.02 }
];
RR.MAT = { dirt: 0, rock: 1, ice: 2, sand: 3, wood: 4, steel: 5, snow: 6, dust: 7, tarmac: 8, kerb: 9, oil: 10, boost: 11, rubber: 12 };

/* ------------------------------------------------------------------ */
/* Collision geometry: directed line segments, solid on the right-hand */
/* side of travel (the normal is the left-hand side).                  */
/* ------------------------------------------------------------------ */
RR.buildCollision = function (chains) {
  var n = 0, c, i;
  for (c = 0; c < chains.length; c++) {

}

/* ---------------- a frame ---------------- */

  S.ring[S.rk++ % 90] = dt * 1000;

/* for tools/perf.js: how hard the showroom is working and whether it had to share the work out */
RR.Showroom.stats = function () { return { costMs: +S.cost.toFixed(2), frameMs: +S.vs.toFixed(2), shared: S.shed, frames: S.frames, skippedRedraws: S.skipped || 0 }; };

    A.garageStand(c, level, cx, cl.ground, Math.min(cl.w * 0.9, (b ? (b.wb + b.rr + b.rf + 0.9) * cl.s : cl.w * 0.6)), S.t);
    if (!b) {

      c.save(); c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = S.arrange ? 'rgba(242,194,48,0.95)' : 'rgba(246,242,231,0.4)';
      var bx = cl.x + cl.w * 0.12, bw = cl.w * 0.76; c.strokeRect(bx, cl.top + (cl.ground - cl.top) * 0.28, bw, (cl.ground - cl.top) * 0.64);
      c.setLineDash([]); c.lineWidth = 3; c.lineCap = 'round'; var py = cl.top + (cl.ground - cl.top) * 0.6, pr = Math.min(10, cl.w * 0.07);
      c.beginPath(); c.moveTo(cx - pr, py); c.lineTo(cx + pr, py); c.moveTo(cx, py - pr); c.lineTo(cx, py + pr); c.stroke(); c.restore();
      continue;

    var sp = spriteFor(cl, b, look(b), i, again), sw = sp.cv.width / dpr, sh = sp.cv.height / dpr;
    var gyc = (sp.hM - 0.06) * sp.s, dx = cx - sw / 2, dy = cl.ground - gyc;
    if (S.pop === i) {
      var k = S.popT / 0.45, hop = Math.sin(k * Math.PI) * cl.s * 0.18 * (1 - k * 0.4);
      c.drawImage(sp.cv, dx, dy - hop, sw, sh);
    } else c.drawImage(sp.cv, dx, dy, sw, sh);
    if (mine === b.id) { c.save(); c.strokeStyle = '#f2c230'; c.lineWidth = 3; c.shadowColor = '#f2c230'; c.shadowBlur = 8; c.beginPath(); c.ellipse(cx, cl.ground + cl.stand * 0.45, Math.min(cl.w * 0.46, sw * 0.5), Math.max(3, cl.stand * 0.4), 0, 0, 6.2832); c.stroke(); c.restore(); }
    if (S.arrange) { c.save(); c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(242,194,48,0.95)'; c.strokeRect(cl.x + 3, cl.top - 1, cl.w - 6, cl.bottom - cl.top + 1); c.restore(); }
    if (cl.lab) pill(c, b.name + (S.arrange ? '' : ''), cx, cl.ground + cl.stand + 1, mine === b.id);

}

/* ---------------- choosing who stands on a spot ---------------- */
